name: Genome validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate seed registry
        run: PYTHONPATH=src python -m leitmotif_genome validate --genome data/genome/starsilk_genome.json --corpus data/corpus/corpus_manifest.json
